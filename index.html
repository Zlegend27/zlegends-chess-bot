<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Opens the TLS connection to the Supabase Storage host before the
         Juice Box ever needs it, so the first mp3 request skips DNS/TLS
         handshake latency -- most of that cost is otherwise paid right
         when someone hits Play. -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0620" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Zlegend2700" />
    <title>Zlegend2700 · Free chess: bots, puzzles and game review</title>
    <meta name="description" content="Free chess in your browser: play bots that play like people, review your Chess.com or Lichess games move by move, solve puzzles, learn openings and play Chess Tactica. No ads, no account needed." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zlegend2700" />
    <meta property="og:title" content="Zlegend2700 · Free chess: bots, puzzles and game review" />
    <meta property="og:description" content="Free chess in your browser: play bots that play like people, review your Chess.com or Lichess games move by move, solve puzzles, learn openings and play Chess Tactica. No ads, no account needed." />
    <meta property="og:image" content="https://www.zlegend2700.com/og.jpg" />
    <meta property="og:image:alt" content="Zlegend2700: free chess in your browser" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zlegend2700 · Free chess: bots, puzzles and game review" />
    <meta name="twitter:description" content="Free chess in your browser: play bots that play like people, review your Chess.com or Lichess games move by move, solve puzzles, learn openings and play Chess Tactica. No ads, no account needed." />
    <meta name="twitter:image" content="https://www.zlegend2700.com/og.jpg" />
    <!-- Shown until the app's script has loaded and drawn over it: the
         theme's background and the header bar with the site's name, so the
         first frame isn't a blank white page. Light theme is read from the
         saved setting (see chooseTheme in App.jsx). -->
    <style>
      html, body { margin: 0; background: #0E0620; }
      html.shellLight, html.shellLight body { background: #FCEFDD; }
      #shell { font: 700 14px 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif; color: #F4EFFF; }
      #shell header { box-sizing: border-box; height: calc(57px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 12px 0; display: flex; align-items: center; border-bottom: 1px solid #8B2FC955; background: #1D1038; }
      html.shellLight #shell { color: #4A1030; }
      html.shellLight #shell header { background: #FFF6E9; border-color: #F0A8C4; }
      /* Each page's own heading and lines (scripts/prerender.mjs), for
         search engines and the moment before the app loads. */
      #shell .seoText { max-width: 32rem; margin: 0 auto; padding: 28px 16px; text-align: center; font-weight: 400; line-height: 1.55; }
      #shell .seoText h1 { margin: 0 0 12px; font: 900 24px/1.2 'Arial Black', Impact, sans-serif; }
      #shell .seoText p { margin: 0 0 12px; color: #C9C2E8; }
      #shell .seoText nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px; margin-top: 8px; }
      #shell .seoText a { color: #3EE7F5; display: inline-block; padding: 8px 0; }
      html.shellLight #shell .seoText p { color: #6B3A55; }
      html.shellLight #shell .seoText a { color: #0E7C86; }
    </style>
    <script>
      try { if (localStorage.getItem("zlegendsBot.lightTheme") === "true") document.documentElement.classList.add("shellLight"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div id="shell"><header>Zlegend2700</header></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
