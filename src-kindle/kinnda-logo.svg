<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kinnda's logo: Owl hugging a chess knight on a warm badge.
       Used for the browser tab, the home-screen icon and the home screen. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB75E"/>
      <stop offset="1" stop-color="#E8622C"/>
    </linearGradient>
    <radialGradient id="owl" cx="42%" cy="30%" r="70%">
      <stop offset="0" stop-color="#D9AE74"/>
      <stop offset="0.6" stop-color="#B98A4E"/>
      <stop offset="1" stop-color="#8C6233"/>
    </radialGradient>
    <clipPath id="badge"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- Ear tufts, then the round owl. -->
    <path d="M13 24 L11 7 L23 16 Z" fill="#B98A4E" stroke="#6E4A22" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M47 24 L49 7 L37 16 Z" fill="#B98A4E" stroke="#6E4A22" stroke-width="1.4" stroke-linejoin="round"/>
    <ellipse cx="30" cy="39" rx="20.5" ry="23" fill="url(#owl)" stroke="#6E4A22" stroke-width="1.4"/>
    <ellipse cx="30" cy="52" rx="12" ry="10" fill="#F4E2BC"/>
    <path d="M22 50 Q24.5 48 27 50 M27 50 Q29.5 48 32 50 M32 50 Q34.5 48 37 50 M24.5 55 Q27 53 29.5 55 M29.5 55 Q32 53 34.5 55" stroke="#B98A4E" stroke-width="1.1" fill="none" stroke-linecap="round"/>
    <!-- Face: feather discs, big amber eyes, beak, rosy cheeks. -->
    <ellipse cx="22.6" cy="30" rx="8" ry="8.6" fill="#F4E2BC"/>
    <ellipse cx="37.4" cy="30" rx="8" ry="8.6" fill="#F4E2BC"/>
    <circle cx="22.6" cy="29.6" r="5.4" fill="#F7B733" stroke="#E9A83A" stroke-width="1.4"/>
    <circle cx="37.4" cy="29.6" r="5.4" fill="#F7B733" stroke="#E9A83A" stroke-width="1.4"/>
    <circle cx="22.6" cy="29.8" r="3.1" fill="#2B1D14"/>
    <circle cx="37.4" cy="29.8" r="3.1" fill="#2B1D14"/>
    <circle cx="21.3" cy="28.2" r="1.3" fill="#fff"/>
    <circle cx="36.1" cy="28.2" r="1.3" fill="#fff"/>
    <ellipse cx="16" cy="37" rx="2.6" ry="1.5" fill="#FF9DB5" opacity="0.75"/>
    <ellipse cx="44" cy="37" rx="2.6" ry="1.5" fill="#FF9DB5" opacity="0.75"/>
    <path d="M27.4 34.4 L32.6 34.4 L30 39.6 Z" fill="#F29F45" stroke="#B86A1E" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- The knight Owl is holding. -->
    <g transform="translate(36.5 33.5)">
      <path d="M4 27 L19 27 L19 24 L17 23 C17 18 18 13 16 8.5 C14 4 10 2 6.6 3 L5.6 0.6 L3.6 3.8 C1.4 5.8 0.2 9 1.2 11.4 L3.4 12.6 C5.4 11.6 7.4 11.6 8.6 12.6 C6.4 15.6 4.6 18.6 4.6 23 L2.6 24 L2.6 27 Z"
        fill="#FFF6E3" stroke="#7A4A17" stroke-width="1.6" stroke-linejoin="round"/>
      <circle cx="7" cy="6.6" r="1.1" fill="#7A4A17"/>
      <path d="M12.6 6 C14.6 9 15 14 14 18" stroke="#E9D3AE" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Wings wrap round the knight and the other side. -->
    <path d="M36.6 42 C42.6 43 44 51 41.4 57 C37 55.6 35 48.6 36.6 42 Z" fill="#8C6233" stroke="#6E4A22" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M14 42 C9 45 9 53 12.6 57 C16.6 54.6 17.4 47.6 14 42 Z" fill="#8C6233" stroke="#6E4A22" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
</svg>
